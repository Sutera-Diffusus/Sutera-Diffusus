<svg xmlns="http://www.w3.org/2000/svg" width="560" height="140" viewBox="0 0 560 140" role="img" aria-label="SuteraWu">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6fbff"/>
      <stop offset="55%" stop-color="#9be9f7"/>
      <stop offset="100%" stop-color="#3ee7f5"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ee7f5" stop-opacity="0"/>
      <stop offset="22%" stop-color="#3ee7f5" stop-opacity="0.95"/>
      <stop offset="78%" stop-color="#0e7490" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 上方导线 -->
  <g stroke="#0e7490" stroke-opacity="0.55" fill="none">
    <path d="M92 26 H150 l10 -10 h44"/>
    <path d="M468 26 H410 l-10 10 h-38"/>
    <circle cx="206" cy="16" r="2.6" fill="#3ee7f5" stroke="none"/>
    <circle cx="360" cy="36" r="2.6" fill="#3ee7f5" stroke="none"/>
  </g>

  <!-- 字标 -->
  <text x="280" y="84" text-anchor="middle"
        font-family="Orbitron, Rajdhani, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="52" font-weight="700" letter-spacing="9" fill="url(#ink)" filter="url(#soft)">SUTERA WU</text>

  <!-- 下方副标题 -->
  <text x="280" y="106" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10.5" letter-spacing="4.2" fill="#5eead4">LOCAL-FIRST DESKTOP SOFTWARE</text>

  <!-- 底部渐变细线 + 扫描光点 -->
  <path d="M60 124 H500" stroke="url(#rule)" stroke-width="1.4"/>
  <circle cy="124" r="2.6" fill="#7df9ff">
    <animate attributeName="cx" values="86;474;86" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;1;0.15" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
