<svg xmlns="http://www.w3.org/2000/svg" width="880" height="332" viewBox="0 0 880 332" role="img" aria-label="SuteraWu — build log">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="55%" stop-color="#071522"/>
      <stop offset="100%" stop-color="#062b3a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#3ee7f5"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ee7f5"/>
      <stop offset="100%" stop-color="#7df9ff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ee7f5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7df9ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3ee7f5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#0e7490" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="878" height="330" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect width="880" height="332" fill="url(#bg)"/>
    <rect width="880" height="332" fill="url(#grid)"/>
    <rect x="1" y="1" width="878" height="3" fill="url(#topbar)" opacity="0.9"/>
    <rect width="880" height="1.4" fill="url(#sweep)">
      <animate attributeName="y" values="-4;336" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- 标题 -->
    <text x="32" y="46" font-size="21" fill="#e6fbff" letter-spacing="3.6" filter="url(#glow)">BUILD LOG</text>
    <text x="32" y="66" font-size="11.5" fill="#5eead4" letter-spacing="1.4">suterawu / deepseek harness ecosystem</text>
    <circle cx="792" cy="44" r="4.5" fill="#3ee7f5">
      <animate attributeName="opacity" values="1;0.18;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="806" y="48" font-size="10.5" fill="#4ade80">live</text>
    <line x1="32" y1="80" x2="848" y2="80" stroke="#0e7490" stroke-opacity="0.45"/>

    <!-- 指标：5 列等距（间距 168），标签居中，避免相邻标签贴在一起 -->
    <g text-anchor="middle">
      <text x="128" y="118" font-size="32" fill="#e6fbff" filter="url(#glow)">141</text>
      <text x="128" y="137" font-size="10" fill="#7dd3fc" letter-spacing="0.8">STARS EARNED</text>
      <text x="296" y="118" font-size="32" fill="#e6fbff" filter="url(#glow)">6</text>
      <text x="296" y="137" font-size="10" fill="#7dd3fc" letter-spacing="0.8">ORIGINAL REPOS</text>
      <text x="464" y="118" font-size="32" fill="#e6fbff" filter="url(#glow)">7</text>
      <text x="464" y="137" font-size="10" fill="#7dd3fc" letter-spacing="0.8">PRS TO OTHER REPOS</text>
      <text x="632" y="118" font-size="32" fill="#e6fbff" filter="url(#glow)">12</text>
      <text x="632" y="137" font-size="10" fill="#7dd3fc" letter-spacing="0.8">FOLLOWERS</text>
      <text x="800" y="118" font-size="32" fill="#e6fbff" filter="url(#glow)">192</text>
      <text x="800" y="137" font-size="10" fill="#7dd3fc" letter-spacing="0.8">CONTRIBUTIONS</text>
    </g>

    <line x1="32" y1="152" x2="848" y2="152" stroke="#0e7490" stroke-opacity="0.3"/>

    <!-- 条形图：仅原创仓库（原始数据，无缩放假设） -->
    <text x="32" y="172" font-size="11" fill="#5eead4" letter-spacing="1.2">STARS BY ORIGINAL REPO</text>
        <text x="32" y="190" font-size="11.5" fill="#64748b"> 99</text>
    <text x="66" y="190" font-size="11.5" fill="#cbd5e1">dsh-whale-musume</text>
    <rect x="268" y="181.4" width="496" height="7.5" rx="3.75" fill="#0e7490" opacity="0.16"/>
    <rect x="268" y="181.4" width="496" height="7.5" rx="3.75" fill="url(#bar)" opacity="0.95">
      <animate attributeName="opacity" values="0.2;0.95" dur="1s" begin="0.00s" fill="freeze"/>
    </rect>
    <text x="32" y="203" font-size="11.5" fill="#64748b"> 32</text>
    <text x="66" y="203" font-size="11.5" fill="#cbd5e1">WeChat-daily</text>
    <rect x="268" y="194.4" width="496" height="7.5" rx="3.75" fill="#0e7490" opacity="0.16"/>
    <rect x="268" y="194.4" width="160" height="7.5" rx="3.75" fill="url(#bar)" opacity="0.95">
      <animate attributeName="opacity" values="0.2;0.95" dur="1s" begin="0.15s" fill="freeze"/>
    </rect>
    <text x="32" y="216" font-size="11.5" fill="#64748b">  5</text>
    <text x="66" y="216" font-size="11.5" fill="#cbd5e1">dsh-sandbox-tester</text>
    <rect x="268" y="207.4" width="496" height="7.5" rx="3.75" fill="#0e7490" opacity="0.16"/>
    <rect x="268" y="207.4" width="25" height="7.5" rx="3.75" fill="url(#bar)" opacity="0.95">
      <animate attributeName="opacity" values="0.2;0.95" dur="1s" begin="0.30s" fill="freeze"/>
    </rect>
    <text x="32" y="229" font-size="11.5" fill="#64748b">  2</text>
    <text x="66" y="229" font-size="11.5" fill="#cbd5e1">dsh-windows-notify</text>
    <rect x="268" y="220.4" width="496" height="7.5" rx="3.75" fill="#0e7490" opacity="0.16"/>
    <rect x="268" y="220.4" width="10" height="7.5" rx="3.75" fill="url(#bar)" opacity="0.95">
      <animate attributeName="opacity" values="0.2;0.95" dur="1s" begin="0.45s" fill="freeze"/>
    </rect>
    <text x="32" y="242" font-size="11.5" fill="#64748b">  2</text>
    <text x="66" y="242" font-size="11.5" fill="#cbd5e1">metera</text>
    <rect x="268" y="233.4" width="496" height="7.5" rx="3.75" fill="#0e7490" opacity="0.16"/>
    <rect x="268" y="233.4" width="10" height="7.5" rx="3.75" fill="url(#bar)" opacity="0.95">
      <animate attributeName="opacity" values="0.2;0.95" dur="1s" begin="0.60s" fill="freeze"/>
    </rect>
    <text x="32" y="255" font-size="11.5" fill="#64748b">  1</text>
    <text x="66" y="255" font-size="11.5" fill="#cbd5e1">dsh-statusbar</text>
    <rect x="268" y="246.4" width="496" height="7.5" rx="3.75" fill="#0e7490" opacity="0.16"/>
    <rect x="268" y="246.4" width="8" height="7.5" rx="3.75" fill="url(#bar)" opacity="0.95">
      <animate attributeName="opacity" values="0.2;0.95" dur="1s" begin="0.75s" fill="freeze"/>
    </rect>

    <line x1="32" y1="294" x2="848" y2="294" stroke="#0e7490" stroke-opacity="0.3"/>

    <!-- 语言分布 -->
    <text x="32" y="314" font-size="11" fill="#5eead4" letter-spacing="1.2">LANGUAGES</text>
        <text x="118" y="314" font-size="11" fill="#93c5fd">JavaScript</text>
    <text x="185" y="314" font-size="11" fill="#3ee7f5">3</text>
    <text x="219" y="314" font-size="11" fill="#93c5fd">Python</text>
    <text x="259.2" y="314" font-size="11" fill="#3ee7f5">1</text>
    <text x="293.2" y="314" font-size="11" fill="#93c5fd">Rust</text>
    <text x="320" y="314" font-size="11" fill="#3ee7f5">1</text>
    <text x="354" y="314" font-size="11" fill="#93c5fd">PowerShell</text>
    <text x="421" y="314" font-size="11" fill="#3ee7f5">1</text>
    <text x="848" y="314" font-size="9.5" fill="#475569" text-anchor="end">generated from the GitHub API</text>
  </g>
  <rect x="1" y="1" width="878" height="330" rx="14" fill="none" stroke="#0e7490" stroke-opacity="0.85" stroke-width="1.5"/>
</svg>
