<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="SuteraWu — build log">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="55%" stop-color="#071522"/>
      <stop offset="100%" stop-color="#062b3a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#3ee7f5"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ee7f5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7df9ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3ee7f5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#0e7490" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="878" height="298" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="300" fill="url(#bg)"/>
    <rect width="880" height="300" fill="url(#grid)"/>
    <rect width="880" height="1.4" fill="url(#sweep)">
      <animate attributeName="y" values="-4;304" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <!-- 标题行 -->
    <text x="34" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#e6fbff" letter-spacing="3.5" filter="url(#glow)">BUILD LOG</text>
    <text x="34" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5eead4" letter-spacing="1.5">suterawu / deepseek harness ecosystem</text>
    <circle cx="806" cy="50" r="4.5" fill="#3ee7f5">
      <animate attributeName="opacity" values="1;0.18;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="822" y="54" font-family="ui-monospace,monospace" font-size="10.5" fill="#4ade80">live</text>
    <line x1="34" y1="92" x2="846" y2="92" stroke="#0e7490" stroke-opacity="0.45"/>

    <!-- 四个核心指标 -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <text x="34" y="132" font-size="34" fill="#e6fbff" filter="url(#glow)">141</text>
      <text x="34" y="152" font-size="11" fill="#7dd3fc" letter-spacing="1.2">STARS EARNED</text>

      <text x="238" y="132" font-size="34" fill="#e6fbff" filter="url(#glow)">7</text>
      <text x="238" y="152" font-size="11" fill="#7dd3fc" letter-spacing="1.2">ORIGINAL REPOS</text>

      <text x="442" y="132" font-size="34" fill="#e6fbff" filter="url(#glow)">7</text>
      <text x="442" y="152" font-size="11" fill="#7dd3fc" letter-spacing="1.2">PRS TO OTHER REPOS</text>

      <text x="646" y="132" font-size="34" fill="#e6fbff" filter="url(#glow)">12</text>
      <text x="646" y="152" font-size="11" fill="#7dd3fc" letter-spacing="1.2">FOLLOWERS</text>
    </g>

    <!-- 星标条形图（真实仓库数据由构建脚本注入） -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#cbd5e1">
            <text x="34" y="200.0" fill="#64748b"> 99</text>
      <text x="72" y="200.0" fill="#cbd5e1">dsh-whale-musume</text>
      <rect x="268" y="191.6" width="500" height="7" rx="3.5" fill="url(#bar)" opacity="0.9">
        <animate attributeName="opacity" values="0.15;0.95" dur="1.1s" begin="0.00s" fill="freeze"/>
      </rect>
      <text x="34" y="213.2" fill="#64748b"> 32</text>
      <text x="72" y="213.2" fill="#cbd5e1">WeChat-daily</text>
      <rect x="268" y="204.8" width="162" height="7" rx="3.5" fill="url(#bar)" opacity="0.9">
        <animate attributeName="opacity" values="0.15;0.95" dur="1.1s" begin="0.18s" fill="freeze"/>
      </rect>
      <text x="34" y="226.4" fill="#64748b">  5</text>
      <text x="72" y="226.4" fill="#cbd5e1">dsh-sandbox-tester</text>
      <rect x="268" y="218.0" width="25" height="7" rx="3.5" fill="url(#bar)" opacity="0.9">
        <animate attributeName="opacity" values="0.15;0.95" dur="1.1s" begin="0.36s" fill="freeze"/>
      </rect>
      <text x="34" y="239.6" fill="#64748b">  2</text>
      <text x="72" y="239.6" fill="#cbd5e1">dsh-windows-notify</text>
      <rect x="268" y="231.2" width="10" height="7" rx="3.5" fill="url(#bar)" opacity="0.9">
        <animate attributeName="opacity" values="0.15;0.95" dur="1.1s" begin="0.54s" fill="freeze"/>
      </rect>
      <text x="34" y="252.8" fill="#64748b">  2</text>
      <text x="72" y="252.8" fill="#cbd5e1">metera</text>
      <rect x="268" y="244.4" width="10" height="7" rx="3.5" fill="url(#bar)" opacity="0.9">
        <animate attributeName="opacity" values="0.15;0.95" dur="1.1s" begin="0.72s" fill="freeze"/>
      </rect>
      <text x="34" y="266.0" fill="#64748b">  1</text>
      <text x="72" y="266.0" fill="#cbd5e1">dsh-statusbar</text>
      <rect x="268" y="257.6" width="6" height="7" rx="3.5" fill="url(#bar)" opacity="0.9">
        <animate attributeName="opacity" values="0.15;0.95" dur="1.1s" begin="0.90s" fill="freeze"/>
      </rect>
    </g>
    <line x1="34" y1="272" x2="846" y2="272" stroke="#0e7490" stroke-opacity="0.45"/>
    <text x="34" y="288" font-family="ui-monospace,monospace" font-size="10" fill="#64748b">generated from the GitHub API · no third-party stats service</text>
  </g>
  <rect x="1" y="1" width="878" height="298" rx="14" fill="none" stroke="#0e7490" stroke-opacity="0.85" stroke-width="1.5"/>
</svg>
